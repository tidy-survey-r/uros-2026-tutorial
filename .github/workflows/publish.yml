on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'

      - name: Install system dependencies for spatial packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudunits2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libsqlite3-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      # The freeze-data branch holds only _freeze/DataCleaning and
      # DerivedData/ess11_der.rds, so DataCleaning.qmd re-runs (and calls
      # the ESS API) only when its code changes.
      - name: Restore DataCleaning freeze and derived data
        run: |
          if git fetch --depth=1 origin freeze-data; then
            git archive FETCH_HEAD | tar -x
          fi

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ESS_USERID: ${{ secrets.ESS_USERID }}

      - name: Save DataCleaning freeze and derived data
        env:
          GIT_INDEX_FILE: ${{ runner.temp }}/freeze-data-index
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898783+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898783+github-actions[bot]@users.noreply.github.com
        run: |
          git add --force _freeze/DataCleaning DerivedData/ess11_der.rds
          tree=$(git write-tree)
          message="Update DataCleaning freeze from $GITHUB_SHA"
          if git fetch --depth=1 origin freeze-data; then
            if [ "$tree" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
              echo "DataCleaning output unchanged"
              exit 0
            fi
            commit=$(git commit-tree "$tree" -p FETCH_HEAD -m "$message")
          else
            commit=$(git commit-tree "$tree" -m "$message")
          fi
          git push origin "$commit:refs/heads/freeze-data"